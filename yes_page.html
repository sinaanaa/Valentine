<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KNEW YOU'D SAY YES! 🎉💖</title>
  <meta name="description" content="Valentine celebration page!">
  <link rel="stylesheet" href="style.css">
  <!-- Canvas Confetti Library CDN for instant celebration effect -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="yes-body">
  <!-- Canvas for custom overlay particles -->
  <canvas id="confettiCanvas"></canvas>
  <div class="hearts-container" id="heartsContainer"></div>

  <main class="card-container">
    <div class="card glass celebratory-card">
      <div class="celebration-badge">💖 IT'S A MATCH! 💖</div>

      <!-- Cute SVG Happy Hugging Bears -->
      <div class="hero-image-wrapper">
        <svg class="valentine-svg victory-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="heartGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff1493" />
              <stop offset="100%" stop-color="#ff69b4" />
            </linearGradient>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffd700" />
              <stop offset="100%" stop-color="#ffaa00" />
            </linearGradient>
          </defs>

          <!-- Floating Celebration Star / Sparkles -->
          <path d="M 30 40 Q 35 40 35 35 Q 35 40 40 40 Q 35 40 35 45 Q 35 40 30 40 Z" fill="url(#goldGrad)" />
          <path d="M 160 30 Q 165 30 165 25 Q 165 30 170 30 Q 165 30 165 35 Q 165 30 160 30 Z" fill="url(#goldGrad)" />

          <!-- Big Glowing Background Heart -->
          <path d="M 100 25 C 100 25 50 -15 50 25 C 50 50 80 75 100 95 C 120 75 150 50 150 25 C 150 -15 100 25 100 25 Z" 
                fill="url(#heartGrad2)" opacity="0.25" class="pulsing-bg-heart"/>

          <!-- Bear 1 (Left Pink Bear) -->
          <g class="happy-bear-left">
            <circle cx="70" cy="95" r="30" fill="#f7b7cb" />
            <circle cx="55" cy="75" r="10" fill="#f7b7cb" />
            <circle cx="55" cy="75" r="5" fill="#fff" />
            <!-- Eyes happy arcs -->
            <path d="M 60 92 Q 65 87 70 92" stroke="#4a1525" stroke-width="2.5" fill="none" stroke-linecap="round" />
            <path d="M 75 92 Q 80 87 85 92" stroke="#4a1525" stroke-width="2.5" fill="none" stroke-linecap="round" />
            <ellipse cx="60" cy="98" rx="4" ry="2.5" fill="#ff4081" opacity="0.6" />
            <ellipse cx="80" cy="98" rx="4" ry="2.5" fill="#ff4081" opacity="0.6" />
          </g>

          <!-- Bear 2 (Right Brown Bear Hugging) -->
          <g class="happy-bear-right">
            <circle cx="120" cy="95" r="30" fill="#d4a373" />
            <circle cx="135" cy="75" r="10" fill="#d4a373" />
            <circle cx="135" cy="75" r="5" fill="#faedcd" />
            <!-- Eyes happy arcs -->
            <path d="M 110 92 Q 115 87 120 92" stroke="#3d2612" stroke-width="2.5" fill="none" stroke-linecap="round" />
            <path d="M 125 92 Q 130 87 135 92" stroke="#3d2612" stroke-width="2.5" fill="none" stroke-linecap="round" />
            <ellipse cx="110" cy="98" rx="4" ry="2.5" fill="#ff70a6" opacity="0.6" />
            <ellipse cx="130" cy="98" rx="4" ry="2.5" fill="#ff70a6" opacity="0.6" />
          </g>

          <!-- Big Heart Held Together -->
          <path class="animated-heart" d="M 100 110 C 100 110 75 85 75 102 C 75 115 90 125 100 135 C 110 125 125 115 125 102 C 125 85 100 110 100 110 Z" 
                fill="url(#heartGrad2)"/>
        </svg>
      </div>

      <h1 class="title victory-title">YAYYYYY! 🎉❤️</h1>
      <p class="subtitle victory-subtitle">Best decision ever! You've made me the happiest person in the world! 🌹✨</p>

      <!-- Sweet Love Letter Container -->
      <div class="love-letter-box">
        <div class="letter-header">💌 A Special Date Coupon 💌</div>
        <p class="letter-body">
          Valid for: <strong>1x Unlimited Hugs, Delicious Treats, Sweet Memories, and Endless Smiles!</strong> 🎟️✨
        </p>
        <p class="letter-footer">See you soon, Valentine! ❤️</p>
      </div>

      <!-- Action Buttons on Yes Page -->
      <div class="buttons-wrapper">
        <button id="celebrateMoreBtn" class="btn btn-yes">
          <span>More Confetti! 🎊</span>
        </button>
        <button id="loveMusicBtn" class="btn btn-secondary">
          <span id="musicBtnText">🎵 Play Romantic Music</span>
        </button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
  <script>
    // Trigger confetti automatically on page load
    window.addEventListener('DOMContentLoaded', () => {
      triggerBigConfetti();
    });
  </script>
</body>
</html>
